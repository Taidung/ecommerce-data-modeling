sources:
  - name: raw 
    schema: raw
    description: "Raw e-commerce dataset from SQL Server"
    tables:
      - name: customer
        description: "Customer data from e-commerce dataset"
        columns:
          - name: customer_id 
            tests: 
              - not_null
              - unique

      - name: product
        description: "Product data from e-commerce dataset" 
        columns:
          - name: product_code
            tests:
              - not_null
              - unique

      - name: region 
        description: "Region data from e-commerce dataset"
        columns:
          - name: region_code
            tests:
              - not_null
              - unique

      - name: ecom_sales
        description: "Sales data from e-commerce dataset"
        columns:
          - name: row_id
            tests:
              - not_null
              - unique