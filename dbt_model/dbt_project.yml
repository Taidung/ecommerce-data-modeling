name: dbt_model

profile: dbt_model

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

models:
  dbt_model:
    staging:
      +materialized: view
      +schema: staging
      +meta:
        dagster:
          group: staging
    intermediate:
      +materialized: view
      +schema: intermediate
      +meta:
        dagster:
          group: intermediate
    warehouse:
      +materialized: table
      +schema: warehouse
      +meta:
        dagster:
          group: warehouse
    marts:
      +materialized: table
      +schema: marts
      +meta:
        dagster:
          group: marts
